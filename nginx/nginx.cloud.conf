server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Résolution DNS dynamique — évite le crash au démarrage si le backend
    # n'est pas encore joignable. Nginx résout le nom à chaque requête
    # au lieu de le résoudre une fois au démarrage.
    resolver 1.1.1.1 8.8.8.8 valid=30s ipv6=off;
    set $backend "quiz-backend.livelywave-3aa1b37a.norwayeast.azurecontainerapps.io";

    # Main app
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin page
    location = /gestion-quiz {
        try_files /gestion-quiz.html =404;
    }

    # API proxy vers le backend Container Apps
    location /api/ {
        proxy_pass https://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
    }

    # Health check
    location /health {
        proxy_pass https://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $backend;
        proxy_ssl_server_name on;
    }
}
