server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Main app
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Admin page
    location = /gestion-quiz {
        try_files /gestion-quiz.html =404;
    }

    # API proxy vers le backend Container Apps (HTTPS interne, port 443)
    location /api/ {
        proxy_pass https://quiz-backend.livelywave-3aa1b37a.norwayeast.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host quiz-backend.livelywave-3aa1b37a.norwayeast.azurecontainerapps.io;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
    }

    # Health check
    location /health {
        proxy_pass https://quiz-backend.livelywave-3aa1b37a.norwayeast.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Host quiz-backend.livelywave-3aa1b37a.norwayeast.azurecontainerapps.io;
        proxy_ssl_server_name on;
    }
}
